# fly.toml for the davey-vibe-trading swarm research service.
#
# Scales to zero (min_machines_running = 0): the machine is started on demand
# by the davey-capital-mcp Tier 2 research routing and stops when idle, so it
# costs nothing when no swarm is running.

app = "davey-vibe-trading"
primary_region = "iad"

[http_service]
  internal_port = 8899
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
